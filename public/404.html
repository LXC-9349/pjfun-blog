<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // 使用 sessionStorage 保存最后一次尝试访问的 URL
      sessionStorage.setItem('redirectUrl', location.pathname + location.search + location.hash);

      // 重定向到站点首页，让前端路由处理；构建时 __BASE_PATH__ 会替换为 VITE_BASE
      location.replace('__BASE_PATH__');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
